<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOT 품질 알림 앱 접속 QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 발표 화면에 띄워 청중이 직접 참여하는 용도: QR 하나 = LOT 품질 알림 앱 (인터넷 주소, 같은 Wi-Fi 필요 없음) */
:root{--bg:#eef0f5;--surface:#fff;--line:#d8dbe5;--fg:#171a24;--muted:#5d6273;--accent:#4b46c8;--bad:#c8333b;
  --f-body:"IBM Plex Sans KR",system-ui,"Malgun Gothic",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d0f15;--surface:#1a1d27;--line:#323748;--fg:#e8eaf2;--muted:#9aa0b4;--accent:#9d99ff;--bad:#ff6b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f15;--surface:#1a1d27;--line:#323748;--fg:#e8eaf2;--muted:#9aa0b4;--accent:#9d99ff;--bad:#ff6b72;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);padding:28px 16px 40px;min-height:100vh;display:grid;place-items:center}
.card{background:var(--surface);border:2px solid var(--accent);border-radius:22px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:min(560px,100%)}
.tag{font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--accent)}
h1{margin:0;font-size:1.9rem;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:1rem;line-height:1.5}
.qr{width:min(400px,80vw);aspect-ratio:1;background:#fff;border-radius:16px;padding:14px;display:grid;place-items:center;margin:6px 0}
.qr svg{width:100%;height:100%;display:block}
.url{font-family:var(--f-mono);font-size:.95rem;word-break:break-all;background:var(--bg);border-radius:10px;padding:8px 12px}
.steps{text-align:left;font-size:.92rem;margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--fg)}
.err{color:var(--bad);font-weight:600}
</style>
</head>
<body>
<main class="card">
  <span class="tag">발표 참여 · 휴대폰으로 접속</span>
  <h1>LOT 품질 알림 앱</h1>
  <p>카메라로 QR을 찍으면 바로 열립니다.<br><b>Wi-Fi·데이터 어느 쪽이든</b> 접속됩니다.</p>
  <div class="qr" id="qr" role="img" aria-label="LOT 품질 알림 앱 접속 QR 코드"></div>
  <span class="url" id="url"></span>
  <ol class="steps">
    <li>앱이 열리면 오른쪽 위 <b>🔔 알림 켜기</b>를 누르세요 (소리·진동 켜짐).</li>
    <li>발표 중 CCR이 작업 지시를 보내면 여러분 휴대폰이 <b>울리고 진동</b>합니다.</li>
    <li><b>확인 · 출동</b>을 누르면 CCR 화면에 응답이 표시됩니다.</li>
  </ol>
  <p style="font-size:.8rem">iPhone은 웹에서 진동을 지원하지 않아 소리·화면으로만 알립니다. 화면을 켜 둔 상태에서 알림을 받습니다.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
// 항상 인터넷(GitHub Pages) 주소로 QR을 만듦 → 같은 Wi-Fi 제한 없음
const PUBLIC='https://siwhan3621-tech.github.io/lot-dashboard/live.html';
const url=/\.github\.io$/.test(location.hostname)?new URL('live.html',location.href).href:PUBLIC;
document.getElementById('url').textContent=url;
const box=document.getElementById('qr');
if(typeof qrcode!=='function'){box.innerHTML='<span class="err">QR을 그리지 못했습니다 (인터넷 연결 확인). 위 주소를 직접 입력하세요.</span>';return}
const q=qrcode(0,'M');q.addData(url);q.make();box.innerHTML=q.createSvgTag({cellSize:8,margin:2,scalable:true});
})();
</script>
</body>
</html>
